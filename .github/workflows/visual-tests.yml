name: visual tests

# Deterministic, backend-free UI visual testing on PRs that touch the frontend.
#
# Runs LAYER A only (layout invariants + axe a11y, incl. the open-overlay and
# hover/focus layout assertions) against the dev-only component gallery served by
# a plain Vite dev server — NO Postgres, NO cargo, NO backend. These need no
# blessed baseline, so they gate every PR.
#
# LAYER B (pixel screenshots) is NOT run here: its baselines are
# environment-specific and must be blessed in a pinned container
# (VISUAL_SNAPSHOTS=1 + `npm run test:visual:update`). See
# src-app/ui/src/dev/gallery/README.md.

on:
  pull_request:
    paths:
      - 'src-app/ui/**'
      # The kit these specs actually guard lives in the `sdk` submodule, so a
      # kit regression arrives as a gitlink bump touching ONLY this path. Without
      # it, the one job that runs the visual layer unfiltered never fires for the
      # exact change class that broke (and fixed) the InputGroup addon.
      - 'sdk'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/visual-tests.yml'
  workflow_dispatch:

# Cancel superseded runs on the same PR.
concurrency:
  group: visual-${{ github.ref }}
  cancel-in-progress: true

jobs:
  layer-a:
    name: Layer A — layout invariants + a11y
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # `submodules: recursive` is REQUIRED, not optional: the kit these specs
      # guard lives in the `sdk` submodule, and root `package.json` declares
      # `sdk/packages/*` as npm workspaces that `@ziee/kit` / `@ziee/gallery`
      # link to. Without it `sdk/` checks out empty, `npm ci` cannot resolve
      # those links, and the job fails before it can test anything — which would
      # make the `sdk` path trigger above fire a job that structurally cannot
      # catch a kit regression.
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # Workspaces hoist to the repo root.
      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        working-directory: src-app/ui
        run: npx playwright install --with-deps chromium

      # Run the CURATED spec list from gallery.config.json — the same list
      # `npm run gate:ui` runs — rather than everything under the visual testDir.
      #
      # This is a correction, not a narrowing. Until the `submodules: recursive`
      # fix above, `npm ci` could not resolve the `sdk/packages/*` workspaces and
      # this job died before reaching Playwright at all, so the unfiltered
      # invocation had never actually executed a spec. Running it now surfaces
      # several long-red specs unrelated to any given PR, which would make the
      # job unable to pass for anyone. `visualSpecs` is the repo's own answer to
      # "which visual specs gate" (gate-ui.mjs reads the same field), so CI and
      # the local gate now agree instead of diverging.
      - name: Run Layer A (deterministic, backend-free; Layer B skipped)
        working-directory: src-app/ui
        run: |
          SPECS=$(node -p "require('./gallery.config.json').visualSpecs.map(s => 'tests/e2e/visual/' + s).join(' ')")
          echo "gating specs: $SPECS"
          npx playwright test -c playwright.visual.config.ts $SPECS

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-report
          path: src-app/ui/playwright-report/
          retention-days: 7
